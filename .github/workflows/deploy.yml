name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-cd:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run tsc

      - name: Write .env
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.ENV_FILE_CONTENT }}" > .env

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          echo "[deploy] current dir: $(pwd)"

          echo "[deploy] building..."
          docker compose build

          echo "[deploy] starting containers..."
          docker compose up -d

          sleep 5
          APP_CONTAINER=$(docker compose ps -q app)
          if [ -z "$APP_CONTAINER" ]; then
            echo "[deploy] app container is not running"
            exit 1
          fi

          echo "[deploy] health check..."
          docker exec "$APP_CONTAINER" node -e "
            const http = require('http');
            const req = http.get('http://127.0.0.1:3000', (res) => process.exit(res.statusCode === 200 ? 0 : 1));
            req.on('error', () => process.exit(1));
            req.setTimeout(5000, () => process.exit(1));
          "

          echo "[deploy] successful"
          docker image prune -f

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::DEPLOY FAILED for ${{ github.repository }}"
          echo "View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # TODO: add Telegram/Slack webhook here if needed
